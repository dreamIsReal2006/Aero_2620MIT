<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Suspended</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-mode">
    <main class="auth-card glass-card" style="max-width:520px;margin:10vh auto;padding:32px">
        <h1>Account suspended</h1>
        <p>Submit an appeal for review.</p>
        <form id="appeal-form">
            <input id="appeal-username" placeholder="Username" required>
            <textarea id="appeal-content" placeholder="Explain your appeal" maxlength="2000" required></textarea>
            <button class="btn btn-primary" type="submit">Submit Appeal</button>
            <p id="appeal-feedback"></p>
        </form>
    </main>
    <script>
        const base = window.location.protocol === 'file:' ? 'http://127.0.0.1:5000/api' : `${window.location.origin}/api`;
        const username = sessionStorage.getItem('aero_suspended_username');
        if (username) document.getElementById('appeal-username').value = username;
        document.getElementById('appeal-form').addEventListener('submit', async event => {
            event.preventDefault();
            const response = await fetch(`${base}/auth/appeals`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: document.getElementById('appeal-username').value, content: document.getElementById('appeal-content').value }) });
            const data = await response.json();
            document.getElementById('appeal-feedback').textContent = data.message || 'Request failed';
        });
    </script>
</body>
</html>
