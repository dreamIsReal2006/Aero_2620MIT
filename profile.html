<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aero - Profile</title>

    <link rel="icon" type="image/png" sizes="16x16" href="./assets/img/logo.png">

    <script src="js/theme.js"></script>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           PROFILE PAGE
        ========================= */

        .profile-page {
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .profile-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: var(--bg-glass);
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(16px);
        }

        .profile-back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .profile-back-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        .profile-header-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .profile-container {
            width: min(900px, calc(100% - 32px));
            margin: 32px auto;
        }

        /* =========================
           PROFILE CARD
        ========================= */

        .profile-card {
            padding: 28px;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            background: var(--bg-card);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .profile-top {
            display: flex;
            align-items: flex-start;
            gap: 24px;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            flex: 0 0 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 50%;
            background: var(--accent-primary);
            color: white;
            font-size: 42px;
            font-weight: 700;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-username {
            margin: 0 0 6px;
            font-size: 28px;
            font-weight: 800;
            word-break: break-word;
        }

        .profile-email {
            margin: 0 0 12px;
            color: var(--text-secondary);
            word-break: break-word;
        }

        .profile-bio {
            margin: 0;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .profile-action-btn {
            padding: 10px 18px;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .profile-action-btn:hover {
            border-color: var(--accent-primary);
        }

        .profile-action-btn.primary {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .profile-action-btn.primary:hover {
            opacity: 0.9;
        }

        /* =========================
           PROFILE STATS
        ========================= */

        .profile-stats {
            display: flex;
            gap: 40px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid var(--border-subtle);
        }

        .profile-stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profile-stat-value {
            font-size: 20px;
            font-weight: 800;
        }

        .profile-stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* =========================
           POSTS
        ========================= */

        .profile-posts-section {
            margin-top: 28px;
        }

        .profile-section-title {
            margin: 0 0 16px;
            font-size: 22px;
            font-weight: 800;
        }

        .profile-posts {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .profile-post {
            padding: 20px;
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            background: var(--bg-card);
        }

        .profile-post-content {
            margin: 0;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .profile-post-date {
            margin-top: 12px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .profile-post-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .profile-post-images img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
        }

        /* =========================
           STATES
        ========================= */

        .profile-loading,
        .profile-error,
        .profile-empty {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .profile-error {
            color: #d9534f;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {
            .profile-container {
                width: min(100% - 20px, 900px);
                margin: 20px auto;
            }

            .profile-card {
                padding: 20px;
            }

            .profile-top {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .profile-info {
                width: 100%;
            }

            .profile-actions {
                justify-content: center;
                flex-wrap: wrap;
            }

            .profile-stats {
                justify-content: center;
                gap: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="profile-page">

        <!-- Header -->
        <header class="profile-header">
            <button
                id="profile-back-btn"
                class="profile-back-btn"
                type="button"
            >
                ← Back
            </button>

            <h1 class="profile-header-title">
                Profile
            </h1>
        </header>

        <main class="profile-container">

            <!-- Profile -->
            <section class="profile-card">

                <div class="profile-top">

                    <div
                        id="profile-avatar"
                        class="profile-avatar"
                        aria-label="Profile picture"
                    >
                        U
                    </div>

                    <div class="profile-info">

                        <h2
                            id="profile-username"
                            class="profile-username"
                        >
                            Loading...
                        </h2>

                        <p
                            id="profile-email"
                            class="profile-email"
                        ></p>

                        <p
                            id="profile-bio"
                            class="profile-bio"
                        ></p>

                        <div class="profile-actions">

                            <button
                                id="profile-follow-btn"
                                class="profile-action-btn primary"
                                type="button"
                                hidden
                            >
                                Follow
                            </button>

                            <button
                                id="profile-edit-btn"
                                class="profile-action-btn"
                                type="button"
                                hidden
                            >
                                Edit Profile
                            </button>

                        </div>

                    </div>

                </div>

                <!-- Stats -->
                <div class="profile-stats">

                    <div class="profile-stat">
                        <span
                            id="profile-post-count"
                            class="profile-stat-value"
                        >
                            0
                        </span>

                        <span class="profile-stat-label">
                            Posts
                        </span>
                    </div>

                    <div class="profile-stat">
                        <span
                            id="profile-follower-count"
                            class="profile-stat-value"
                        >
                            0
                        </span>

                        <span class="profile-stat-label">
                            Followers
                        </span>
                    </div>

                    <div class="profile-stat">
                        <span
                            id="profile-following-count"
                            class="profile-stat-value"
                        >
                            0
                        </span>

                        <span class="profile-stat-label">
                            Following
                        </span>
                    </div>

                </div>

            </section>

            <!-- Posts -->
            <section class="profile-posts-section">

                <h2 class="profile-section-title">
                    Posts
                </h2>

                <div
                    id="profile-posts"
                    class="profile-posts"
                >
                    <div class="profile-loading">
                        Loading posts...
                    </div>
                </div>

            </section>

        </main>
    </div>

    <script src="js/profile.js"></script>
</body>
</html>
