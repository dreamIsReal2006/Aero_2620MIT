<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="js/theme.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aero - Profile</title>

    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="./assets/img/logo.png">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .profile-page {
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .profile-header {
            position: sticky;
            top: 0;
            z-index: 20;

            display: flex;
            align-items: center;

            height: 64px;
            padding: 0 24px;

            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-bottom: 1px solid var(--border-subtle);
        }

        .profile-back-btn {
            border: none;
            background: transparent;

            color: var(--text-primary);

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            padding: 10px 14px;
            border-radius: 12px;

            transition: background 0.2s ease;
        }

        .profile-back-btn:hover {
            background: var(--accent-light-fill);
        }

        .profile-header-title {
            flex: 1;
            text-align: center;

            font-size: 18px;
            font-weight: 700;
        }

        .profile-header-spacer {
            width: 80px;
        }

        .profile-container {
            width: min(760px, calc(100% - 32px));
            margin: 32px auto 60px;
        }

        .profile-card {
            padding: 28px;
            border-radius: var(--g2-radius-card);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-floating);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .profile-avatar {
            width: 112px;
            height: 112px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: var(--accent-light-fill);
            color: var(--accent-primary);

            font-size: 40px;
            font-weight: 700;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-username {
            margin: 0;

            font-size: 28px;
            line-height: 1.2;
            font-weight: 800;

            word-break: break-word;
        }

        .profile-email {
            margin-top: 6px;

            color: var(--text-secondary);

            font-size: 14px;
        }

        .profile-bio {
            margin: 14px 0 0;

            color: var(--text-secondary);

            line-height: 1.5;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .profile-actions {
            margin-top: 20px;

            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .profile-action-btn {
            border: none;

            padding: 10px 18px;

            border-radius: var(--g2-radius-btn);

            font-weight: 700;
            font-size: 14px;

            cursor: pointer;
        }

        .profile-follow-btn {
            background: var(--accent-primary);
            color: white;
        }

        .profile-follow-btn.following {
            background: var(--accent-light-fill);
            color: var(--accent-primary);
        }

        .profile-edit-btn {
            background: var(--accent-light-fill);
            color: var(--accent-primary);
        }

        .profile-stats {
            display: flex;
            gap: 30px;

            margin-top: 26px;
            padding-top: 22px;

            border-top: 1px solid var(--border-subtle);
        }

        .profile-stat {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .profile-stat-number {
            font-size: 20px;
            font-weight: 800;
        }

        .profile-stat-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .profile-posts-title {
            margin: 32px 0 14px;

            font-size: 20px;
            font-weight: 800;
        }

        .profile-posts {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .profile-post {
            padding: 20px;

            background: var(--bg-card);

            border: 1px solid var(--border-subtle);
            border-radius: 20px;

            box-shadow: var(--shadow-floating);
        }

        .profile-post-content {
            margin: 0;

            line-height: 1.55;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .profile-post-date {
            margin-top: 12px;

            color: var(--text-secondary);
            font-size: 12px;
        }

        .profile-post-media {
            margin-top: 14px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 8px;
        }

        .profile-post-media img,
        .profile-post-media video {
            width: 100%;
            max-height: 420px;

            object-fit: cover;

            border-radius: 14px;

            background: var(--bg-primary);
        }

        .profile-post-media video {
            object-fit: contain;
        }

        .profile-loading,
        .profile-error,
        .profile-empty {
            padding: 40px 20px;

            text-align: center;

            color: var(--text-secondary);
        }

        .profile-error {
            color: var(--color-danger);
        }

        .profile-modal {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.45);
        }

        .profile-modal.active {
            display: flex;
        }

        .profile-modal-card {
            width: min(500px, 100%);

            padding: 24px;

            background: var(--bg-card);

            border-radius: 24px;
            box-shadow: var(--shadow-floating);
        }

        .profile-modal-title {
            margin: 0 0 20px;

            font-size: 22px;
            font-weight: 800;
        }

        .profile-field {
            margin-bottom: 16px;
        }

        .profile-field label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;
        }

        .profile-field input,
        .profile-field textarea {
            width: 100%;

            box-sizing: border-box;

            border: 1px solid var(--border-subtle);

            background: var(--bg-primary);
            color: var(--text-primary);

            border-radius: 14px;

            padding: 12px 14px;

            outline: none;
        }

        .profile-field textarea {
            min-height: 110px;
            resize: vertical;
        }

        .profile-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;

            margin-top: 20px;
        }

        .profile-cancel-btn,
        .profile-save-btn {
            border: none;

            padding: 10px 18px;

            border-radius: 14px;

            font-weight: 700;

            cursor: pointer;
        }

        .profile-cancel-btn {
            background: var(--accent-light-fill);
            color: var(--text-primary);
        }

        .profile-save-btn {
            background: var(--accent-primary);
            color: white;
        }

        @media (max-width: 600px) {
            .profile-container {
                width: min(100% - 20px, 760px);
                margin-top: 20px;
            }

            .profile-card {
                padding: 20px;
            }

            .profile-top {
                align-items: flex-start;
            }

            .profile-avatar {
                width: 80px;
                height: 80px;

                font-size: 30px;
            }

            .profile-username {
                font-size: 22px;
            }

            .profile-post-media {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="light-mode">

<header class="profile-header">

    <button
        id="profile-back-btn"
        class="profile-back-btn"
        type="button">
        ← Back
    </button>

    <div class="profile-header-title">
        Profile
    </div>

    <div class="profile-header-spacer"></div>

</header>


<main class="profile-page">

    <div class="profile-container">

        <section class="profile-card">

            <div id="profile-loading"
                 class="profile-loading">
                Loading profile...
            </div>

            <div id="profile-content"
                 style="display:none;">

                <div class="profile-top">

                    <div
                        id="profile-avatar"
                        class="profile-avatar">
                        U
                    </div>

                    <div class="profile-info">

                        <h1
                            id="profile-username"
                            class="profile-username">
                            User
                        </h1>

                        <div
                            id="profile-email"
                            class="profile-email">
                        </div>

                        <p
                            id="profile-bio"
                            class="profile-bio">
                        </p>

                    </div>

                </div>


                <div
                    id="profile-actions"
                    class="profile-actions">

                    <button
                        id="profile-follow-btn"
                        class="profile-action-btn profile-follow-btn"
                        type="button">
                        Follow
                    </button>

                    <button
                        id="profile-edit-btn"
                        class="profile-action-btn profile-edit-btn"
                        type="button"
                        style="display:none;">
                        Edit Profile
                    </button>

                </div>


                <div class="profile-stats">

                    <div class="profile-stat">

                        <span
                            id="profile-post-count"
                            class="profile-stat-number">
                            0
                        </span>

                        <span class="profile-stat-label">
                            Posts
                        </span>

                    </div>

                    <div class="profile-stat">

                        <span
                            id="profile-followers"
                            class="profile-stat-number">
                            0
                        </span>

                        <span class="profile-stat-label">
                            Followers
                        </span>

                    </div>

                    <div class="profile-stat">

                        <span
                            id="profile-following"
                            class="profile-stat-number">
                            0
                        </span>

                        <span class="profile-stat-label">
                            Following
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <h2
            id="profile-posts-title"
            class="profile-posts-title"
            style="display:none;">
            Posts
        </h2>

        <section
            id="profile-posts"
            class="profile-posts">
        </section>

    </div>

</main>


<div
    id="profile-edit-modal"
    class="profile-modal">

    <div class="profile-modal-card">

        <h2 class="profile-modal-title">
            Edit Profile
        </h2>

        <div class="profile-field">

            <label for="edit-username">
                Username
            </label>

            <input
                id="edit-username"
                type="text"
                maxlength="50">

        </div>

        <div class="profile-field">

            <label for="edit-bio">
                Bio
            </label>

            <textarea
                id="edit-bio"
                maxlength="500"></textarea>

        </div>

        <div class="profile-field">

            <label for="edit-avatar">
                Avatar URL
            </label>

            <input
                id="edit-avatar"
                type="text"
                placeholder="/uploads/avatar.jpg">

        </div>

        <div class="profile-modal-actions">

            <button
                id="profile-cancel-btn"
                class="profile-cancel-btn"
                type="button">
                Cancel
            </button>

            <button
                id="profile-save-btn"
                class="profile-save-btn"
                type="button">
                Save
            </button>

        </div>

    </div>

</div>


<script src="js/profile.js"></script>

</body>
</html>
